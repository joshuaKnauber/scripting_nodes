schema_version = "1.0.0"

id = "scripting_nodes"
version = "4.0.0-beta.1"
name = "Scripting Nodes"
tagline = "Build Blender addons visually with nodes"
maintainer = "Joshua Knauber, Finn Knauber"
type = "add-on"

website = "https://joshuaknauber.github.io/scripting_nodes/"

blender_version_min = "5.0.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

# Tags for categorization on the extensions platform
tags = ["Development", "Node"]

[permissions]
files = "Writes the generated add-ons to the user scripts folder"
network = "Optional MCP server on localhost for AI assistants"
clipboard = "Copies data paths and setup snippets, pastes data paths"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.zip",
]
