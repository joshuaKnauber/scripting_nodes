# What generated add-ons are checked against (the code a careful author would
# write): python scripts/example_addon.py, CI. The repo's own ruff settings
# exclude tests/snapshots.
target-version = "py311"
line-length = 88

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PLC", "BLE", "C4"]
ignore = [
    "RUF012", # bl_options = {...} as class attribute is how bpy classes work
]
